spring:
  application:
    name: ecommerce-backend
  config:
    # En desarrollo, los secretos se pueden poner en el archivo .env de la raíz del repositorio.
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo valida que las entidades coincidan.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      # Sin valor por defecto: la aplicación no arranca si falta JWT_SECRET.
      secret: ${JWT_SECRET:}
      issuer: ecommerce-api
      access-token-ttl: 15m
    refresh-token:
      ttl: 7d
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    login-rate-limit:
      max-failures: 5
      window: 15m
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
